<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Workshop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="container">
        <h2>Web Development Workshop</h2>
        <p class="seats">Number of available seats: 23</p>

        <div class="content">

            <div class="image">
                <img src=div class="image">
                <img src="images/working-on-desk.jpg"web Development">
            </div>

            <form>
                <div class="input-box">
                    <span><i class="fa-solid fa-user"></i><b>*</b></span>
                    <input type="text" placeholder="Username" required>
                </div>

                <div class="input-box">
                    <span><i class="fa-solid fa-envelope"></i><b>*</b></span>
                    <input type="email" placeholder="Email" required>
                </div>

                <div class="input-box">
                    <span><i class="fa-solid fa-phone"></i><b>*</b></span>
                    <input type="tel" placeholder="Phone No" required>
                </div>

                <div class="input-box">
                    <span><i class="fa-regular fa-square-check"></i></span>
                    <select required>
                        <option value="" disabled selected>Choose no of seats</option>
                        <option>1 Seat</option>
                        <option>2 Seats</option>
                        <option>3 Seats</option>
                    </select>
                </div>

                <div class="input-box">
                    <span><i class="fa-solid fa-user-plus"></i></span>
                    <input type="text" placeholder="Second username">
                </div>

                <div class="buttons">
                    <button type="submit">Submit</button>
                    <button type="reset" class="cancel">Cancel</button>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
